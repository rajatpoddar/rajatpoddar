<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Rajat Poddar — Full-Stack Developer">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="barL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="lblob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lblob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bgL)"/>

  <!-- soft pastel shapes -->
  <circle cx="150" cy="60" r="190" fill="url(#lblob1)"/>
  <circle cx="1080" cy="230" r="210" fill="url(#lblob2)"/>

  <!-- faint code deco -->
  <g fill="#312e81" opacity="0.10" font-family="Consolas, Menlo, monospace" font-weight="bold">
    <text x="60"  y="90"  font-size="46">{ }</text>
    <text x="1050" y="110" font-size="46">&lt;/&gt;</text>
    <text x="180" y="240" font-size="34">&lt;/&gt;</text>
    <text x="930" y="52"  font-size="34">{ }</text>
  </g>
  <g stroke="#312e81" opacity="0.08" stroke-width="1.4" fill="none">
    <circle cx="1120" cy="70" r="42"/>
    <circle cx="85" cy="225" r="56"/>
  </g>

  <!-- name + role -->
  <text x="600" y="132" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#0f172a" letter-spacing="1">Rajat Poddar</text>
  <text x="600" y="182" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" letter-spacing="0.5">Full-Stack Web &amp; App Developer &#183; SaaS &#183; Automation &#183; AI Agents</text>

  <!-- accent bar -->
  <rect x="450" y="212" width="300" height="7" rx="3.5" fill="url(#barL)"/>
</svg>
