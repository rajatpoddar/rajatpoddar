<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Rajat Poddar — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.45" stop-color="#160f33"/>
      <stop offset="1" stop-color="#07203a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2be2"/>
      <stop offset="0.5" stop-color="#3b82fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a2be2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- soft glows -->
  <circle cx="150" cy="60" r="190" fill="url(#blob1)"/>
  <circle cx="1080" cy="230" r="210" fill="url(#blob2)"/>

  <!-- faint code deco -->
  <g fill="#ffffff" opacity="0.06" font-family="Consolas, Menlo, monospace" font-weight="bold">
    <text x="60"  y="90"  font-size="46">{ }</text>
    <text x="1050" y="110" font-size="46">&lt;/&gt;</text>
    <text x="180" y="240" font-size="34">&lt;/&gt;</text>
    <text x="930" y="52"  font-size="34">{ }</text>
  </g>
  <g stroke="#ffffff" opacity="0.05" stroke-width="1.4" fill="none">
    <circle cx="1120" cy="70" r="42"/>
    <circle cx="85" cy="225" r="56"/>
  </g>

  <!-- name + role -->
  <text x="600" y="132" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="1">Rajat Poddar</text>
  <text x="600" y="182" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#93a7bd" letter-spacing="0.5">Full-Stack Web &amp; App Developer &#183; SaaS &#183; Automation &#183; AI Agents</text>

  <!-- accent bar -->
  <rect x="450" y="212" width="300" height="7" rx="3.5" fill="url(#bar)"/>
</svg>
